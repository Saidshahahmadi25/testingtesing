<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Navbar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f8fc;
      padding: 20px;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;

      background: rgba(255, 255, 255, 0.95);

      border-radius: 18px;
      border: 1px solid #e7edf5;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);

      position: relative;
      z-index: 1000;
    }

    .navbar-container {
      padding: 14px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Logo */

    .logo {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #00c2ff,
        #0099f4
      );

      color: white;

      font-size: 20px;
      font-weight: bold;

      box-shadow: 0 6px 15px rgba(0, 153, 244, 0.25);
    }

    .logo-text {
      font-size: 23px;
      font-weight: 700;
      color: #111827;
    }

    .logo-text span {
      color: #0099f4;
    }

    /* Menu */

    .nav-menu {
      display: flex;
      align-items: center;

      gap: 8px;

      list-style: none;
    }

    .nav-link {
      display: block;

      padding: 10px 15px;

      border-radius: 10px;

      text-decoration: none;

      color: #4b5563;

      font-size: 14px;
      font-weight: 600;

      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background: #eef8ff;
      color: #0099f4;
    }

    .nav-link.active {
      background: #e4f5ff;
      color: #0099f4;
    }

    /* Actions */

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .login-btn {
      padding: 11px 21px;

      border-radius: 12px;

      text-decoration: none;

      color: white;

      font-size: 14px;
      font-weight: 600;

      background: linear-gradient(
        135deg,
        #00c2ff,
        #0099f4
      );

      box-shadow: 0 7px 16px rgba(0, 153, 244, 0.25);

      transition: 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);

      box-shadow: 0 10px 20px rgba(0, 153, 244, 0.32);
    }

    /* Menu Button */

    .menu-btn {
      display: none;

      width: 42px;
      height: 42px;

      border: none;
      border-radius: 10px;

      background: #eef8ff;
      color: #0099f4;

      font-size: 24px;

      cursor: pointer;
    }

    /* Mobile */

    @media (max-width: 768px) {

      body {
        padding: 12px;
      }

      .navbar {
        border-radius: 14px;
      }

      .navbar-container {
        padding: 12px 14px;
      }

      .nav-menu {
        display: none;

        position: absolute;

        top: calc(100% + 10px);
        left: 0;

        width: 100%;

        background: white;

        padding: 12px;

        border-radius: 14px;

        flex-direction: column;
        align-items: stretch;

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);

        border: 1px solid #e7edf5;
      }

      .nav-menu.active {
        display: flex;
      }

      .nav-menu li {
        width: 100%;
      }

      .nav-link {
        width: 100%;

        padding: 13px 14px;
      }

      .login-btn {
        display: none;
      }

      .menu-btn {
        display: block;
      }

      .logo-text {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">

    <div class="navbar-container">

      <!-- Logo -->

      <a href="#" class="logo">

        <div class="logo-icon">
          U
        </div>

        <div class="logo-text">
          Up<span>skill</span>
        </div>

      </a>


      <!-- Navigation -->

      <ul class="nav-menu" id="navMenu">

        <li>
          <a href="#" class="nav-link active">
            Home
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            About
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Courses
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Students
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Blog
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Contact
          </a>
        </li>

      </ul>


      <!-- Actions -->

      <div class="nav-actions">

        <a href="#" class="login-btn">
          Get Started
        </a>

        <button
          class="menu-btn"
          id="menuBtn"
          aria-label="Toggle menu"
        >
          ☰
        </button>

      </div>

    </div>

  </nav>


  <script>
    const menuBtn = document.getElementById("menuBtn");
    const navMenu = document.getElementById("navMenu");
    const navLinks = document.querySelectorAll(".nav-link");


    menuBtn.addEventListener("click", function () {

      navMenu.classList.toggle("active");

      if (navMenu.classList.contains("active")) {
        menuBtn.innerHTML = "✕";
      } else {
        menuBtn.innerHTML = "☰";
      }

    });


    navLinks.forEach(function (link) {

      link.addEventListener("click", function () {

        navLinks.forEach(function (item) {
          item.classList.remove("active");
        });

        this.classList.add("active");

        navMenu.classList.remove("active");

        menuBtn.innerHTML = "☰";

      });

    });
  </script>

</body>
</html>
